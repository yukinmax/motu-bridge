[project]
name = "motu-bridge"
version = "0.8.1"
description = "Bridge between a SKAARHOJ RAW panel and a MOTU AVB audio interface, with a REST API and Prometheus metrics"
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL-3.0-only"
dependencies = [
    "aiohttp>=3.9.0",
    "aioprometheus[quart]>=23.12.0",
    "hypercorn>=0.18.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.6.0",
    "quart>=0.22.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.2",
]

[tool.ruff]
src = ["src"]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ASYNC", "RET", "RUF"]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
