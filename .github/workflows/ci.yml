name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use the oldest Python that pyproject.toml supports
        run: |
          python3 - >> "$GITHUB_ENV" <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as f:
              requires = tomllib.load(f)["project"]["requires-python"]
          print("UV_PYTHON=" + requires.removeprefix(">="))
          PY

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --locked

      - run: uv run ruff check .

      - run: uv run ruff format --check .

      - run: uv run pytest

  version:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Leave the version to release PRs
        env:
          BASE: ${{ github.base_ref }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import tomllib
          from pathlib import Path


          def lock_version(text):
              packages = tomllib.loads(text)["package"]
              return next(p["version"] for p in packages if p["name"] == "motu-bridge")


          readers = {
              "pyproject.toml": lambda text: tomllib.loads(text)["project"]["version"],
              "uv.lock": lock_version,
              ".release-please-manifest.json": lambda text: json.loads(text)["."],
          }
          changed = []
          for path, read in readers.items():
              base = subprocess.run(
                  ["git", "show", f"origin/{os.environ['BASE']}:{path}"],
                  capture_output=True,
                  text=True,
              )
              if base.returncode != 0:
                  continue  # not on the base branch yet
              old, new = read(base.stdout), read(Path(path).read_text())
              if old != new:
                  changed.append(f"{path} ({old} -> {new})")
          if changed:
              print(
                  f"::error::Version changed in {', '.join(changed)}. "
                  "Versions are bumped only by release-please release PRs."
              )
              raise SystemExit(1)
          PY
